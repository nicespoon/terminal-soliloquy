[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-soliloquy"
version = "0.1.0"
description = "Turns LLM context limits into an immersive, living piece of monochrome terminal art."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "ollama>=0.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
terminal-soliloquy = "terminal_soliloquy.main:main"

[tool.setuptools.packages.find]
where = ["src"]
