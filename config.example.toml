[ollama]
host = "http://localhost:11434"  # Change to remote IP/host if needed, e.g., "http://192.168.1.100:11434"
model = "llama3"
timeout = 60.0

[soliloquy]
max_context_tokens = 2048
poll_delay = 1.5
auto_restart = false
prompt_file = "prompt.txt"
screen_padding = [0, 0]  # [vertical, horizontal] or [top, right, bottom, left]